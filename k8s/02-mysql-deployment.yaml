# ===== PARTIE 1 : le volume persistant (le "disque" de MySQL) =====
apiVersion: v1                       # Version de l'API Kubernetes pour cet objet (PVC = API "core" v1)
kind: PersistentVolumeClaim          # Type d'objet : une demande de stockage
metadata:                            # Informations d'identification de l'objet
  name: mysql-data                   # Nom du PVC (référencé plus bas par le Deployment)
  namespace: bijouterie              # Namespace où il est créé
spec:                                # Description de ce qu'on demande
  accessModes: ["ReadWriteOnce"]     # Le volume peut être monté en lecture/écriture par UN seul nœud à la fois
  resources:                         # Ressources demandées
    requests:                        # Minimum demandé
      storage: 2Gi                   # Taille du disque : 2 gibioctets
---                                  # Séparateur : début d'un nouvel objet dans le même fichier

# ===== PARTIE 2 : le Deployment MySQL =====
apiVersion: apps/v1                  # Les Deployments sont dans le groupe d'API "apps", version v1
kind: Deployment                     # Type d'objet : gère des pods et leurs mises à jour
metadata:                            # Identification du Deployment
  name: mysql                        # Nom du Deployment
  namespace: bijouterie              # Namespace
  labels: { app: mysql }             # Étiquette posée sur le Deployment (pour le retrouver/filtrer)
spec:                                # Description du comportement voulu
  replicas: 1                        # Nombre de pods : 1 seul (une base de données ne se duplique pas ainsi)
  strategy:                          # Façon de remplacer les pods lors d'une mise à jour
    type: Recreate                   # On arrête l'ancien pod AVANT de démarrer le nouveau
                                     # (évite que 2 MySQL écrivent sur le même volume)
  selector:                          # Comment le Deployment retrouve ses pods
    matchLabels: { app: mysql }      # Il gère les pods qui ont l'étiquette app=mysql
  template:                          # Modèle utilisé pour créer chaque pod
    metadata:                        # Métadonnées du pod
      labels: { app: mysql }         # Étiquette du pod : doit correspondre au selector ci-dessus
                                     # (c'est aussi ce que le Service "mysql" cible)
    spec:                            # Contenu du pod
      containers:                    # Liste des conteneurs du pod
        - name: mysql                # Nom du conteneur
          image: omar926/mysqlb:v1   # Image Docker à lancer (remplacée par Jenkins avec le bon tag)
          ports:                     # Ports du conteneur
            - containerPort: 3306    # MySQL écoute sur 3306 (indicatif, documente le port)
          env:                       # Variables d'environnement écrites directement ici
            - name: MYSQL_DATABASE   # Nom de la variable : base à créer au premier démarrage
              value: bijouterie      # Sa valeur : la base s'appelle "bijouterie"
          envFrom:                   # Injecter d'un coup toutes les clés d'une source externe
            - secretRef:             # La source est un Secret
                name: mysql-secret   # Le Secret "mysql-secret" : donne MYSQL_ROOT_PASSWORD, MYSQL_USER, MYSQL_PASSWORD
          volumeMounts:              # Où monter les volumes dans le conteneur
            - name: data             # Nom du volume à monter (défini dans "volumes" plus bas)
              mountPath: /var/lib/mysql   # Dossier où MySQL stocke ses données : il est donc sur le disque persistant
          readinessProbe:            # Test "prêt ?" : tant qu'il échoue, le pod ne reçoit pas de trafic
            exec:                    # Le test consiste à exécuter une commande dans le conteneur
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"]
                                     # Lance un shell qui "ping" MySQL ; code 0 = MySQL répond = prêt
            initialDelaySeconds: 15  # Attendre 15 s après le démarrage avant le 1er test
            periodSeconds: 5         # Refaire le test toutes les 5 s
            timeoutSeconds: 3        # Le test échoue s'il dure plus de 3 s
          livenessProbe:             # Test "vivant ?" : s'il échoue plusieurs fois, Kubernetes redémarre le conteneur
            exec:                    # Même principe : commande exécutée dans le conteneur
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"]
                                     # Même commande de ping
            initialDelaySeconds: 45  # Attendre 45 s (plus long : MySQL met du temps à initialiser la base)
            periodSeconds: 10        # Tester toutes les 10 s
            timeoutSeconds: 3        # Échec si plus de 3 s
          resources:                 # Gestion des ressources CPU/mémoire
            requests: { cpu: 250m, memory: 512Mi }   # Réservé au minimum : 0,25 CPU et 512 Mo (sert au placement du pod)
            limits:   { cpu: "1",  memory: 1Gi }     # Maximum autorisé : 1 CPU et 1 Go (au-delà : bridé ou tué)
      volumes:                       # Volumes disponibles pour le pod
        - name: data                 # Nom du volume (celui utilisé dans volumeMounts)
          persistentVolumeClaim:     # Ce volume vient d'un PVC
            claimName: mysql-data    # Le PVC créé dans la partie 1 : les données survivent aux redémarrages