# Valeurs d'exemple pour le TP. En production : Sealed Secrets / External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: bijouterie
type: Opaque
stringData:
  MYSQL_DATABASE: "bijouterie"
  MYSQL_ROOT_PASSWORD: "rootpass"
  MYSQL_USER: "bijoux"
  MYSQL_PASSWORD: "bijouxpass"
